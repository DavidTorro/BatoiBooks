services:
  batoibooks:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    command: sh -c "npm ci && npm run api -- --host 0.0.0.0"
